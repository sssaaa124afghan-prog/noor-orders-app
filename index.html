<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأوردرات"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f4f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121014" media="(prefers-color-scheme: dark)">
<title>أوردرات العطور</title>
<style>
/* «Mauve Atelier» — cool stone neutrals, plum-ink accent, bergamot only for «ready». RTL, light + dark, iPhone safe areas. */
:root{--bg:#f6f4f7;--surface:#fff;--surface-2:#eeebf0;--line:#e2dee5;--ink:#1e1a22;--ink-2:#5d5664;--ink-3:#8e8795;
 --plum:#7a2e6b;--plum-2:#64235a;--plum-soft:#f3e6f0;--on-plum:#fff;--berg:#c9e265;--berg-ink:#4c6300;--danger:#c2362b;--danger-soft:#fbe7e5;--amber:#9a5b00;--amber-soft:#fdf0dc;
 --st-open-t:#9a5b00;--st-open-b:#fdf0dc;--st-ready-t:#4c6300;--st-ready-b:#eef6cf;--st-del-t:#1f6e6a;--st-del-b:#dff2f0;--st-inv-t:#7a2e6b;--st-inv-b:#f3e6f0;--st-can-t:#8e8795;--st-can-b:#eeebf0;
 --sh-1:0 1px 2px rgb(30 26 34/.06);--sh-2:0 8px 28px rgb(30 26 34/.14);
 --font:"IBM Plex Sans Arabic","SF Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,system-ui,sans-serif;
 --t-fast:120ms;--t-base:200ms;--t-sheet:320ms;--in:cubic-bezier(.2,.8,.2,1);--out:cubic-bezier(.4,0,1,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121014;--surface:#1c1a1f;--surface-2:#26232a;--line:#34303a;--ink:#f2eef4;--ink-2:#b3abb9;--ink-3:#7e7685;
 --plum:#d98cc8;--plum-2:#e7a9da;--plum-soft:#3a2236;--on-plum:#1e0f1b;--berg-ink:#d5ec7a;--danger:#ff7a6e;--danger-soft:#3a1c1a;--amber:#ffc266;--amber-soft:#3a2a12;
 --st-open-t:#ffc266;--st-open-b:#3a2a12;--st-ready-t:#d5ec7a;--st-ready-b:#2a3311;--st-del-t:#7fd6cf;--st-del-b:#13302e;--st-inv-t:#e7a9da;--st-inv-b:#3a2236;--st-can-t:#7e7685;--st-can-b:#26232a;--sh-1:none;--sh-2:0 8px 28px rgb(0 0 0/.5)}}
:root[data-theme="dark"]{--bg:#121014;--surface:#1c1a1f;--surface-2:#26232a;--line:#34303a;--ink:#f2eef4;--ink-2:#b3abb9;--ink-3:#7e7685;--plum:#d98cc8;--plum-2:#e7a9da;--plum-soft:#3a2236;--on-plum:#1e0f1b;--berg-ink:#d5ec7a;--danger:#ff7a6e;--danger-soft:#3a1c1a;--amber:#ffc266;--amber-soft:#3a2a12;
 --st-open-t:#ffc266;--st-open-b:#3a2a12;--st-ready-t:#d5ec7a;--st-ready-b:#2a3311;--st-del-t:#7fd6cf;--st-del-b:#13302e;--st-inv-t:#e7a9da;--st-inv-b:#3a2236;--st-can-t:#7e7685;--st-can-b:#26232a;--sh-1:none;--sh-2:0 8px 28px rgb(0 0 0/.5)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.47 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
.num,.code{font-variant-numeric:tabular-nums}
.code{font-weight:600;letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:10px;background:var(--plum);color:var(--on-plum);font-weight:600;white-space:nowrap;transition:transform var(--t-fast) var(--in),background var(--t-base)}
.btn:hover{background:var(--plum-2)}.btn:active{transform:scale(.97)}
.btn.soft{background:var(--plum-soft);color:var(--plum)}
.btn.ghost{background:transparent;color:var(--plum)}.btn.ghost:hover{background:var(--surface-2)}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.line:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.icon{width:40px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px 12px;font-size:15px;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.in:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
textarea.in{min-height:72px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--ink-2);margin:0 2px 5px;font-weight:500}
/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mk{width:38px;height:38px;border-radius:11px;background:var(--plum);color:var(--on-plum);display:grid;place-items:center}
.brand b{font-size:16px;display:block;line-height:1.2}.brand small{color:var(--ink-3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;color:var(--ink-2);font-weight:500;text-align:start;transition:background var(--t-fast)}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--plum-soft);color:var(--plum);font-weight:600}
.nav .n{margin-inline-start:auto;font-size:12px;min-width:22px;text-align:center;border-radius:999px;padding:0 6px;background:var(--surface-2);color:var(--ink-2)}
.nav button[aria-current="page"] .n{background:var(--plum);color:var(--on-plum)}
.side .foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:8px}
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 32px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font-size:24px;font-weight:600;line-height:1.25;min-width:160px}
.sf{position:relative;flex:1;max-width:520px}
.sf .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:18px;height:18px}
.sf input{padding-inline-start:38px;background:var(--surface);min-height:44px}
.sf kbd{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.badge{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--berg)}
.badge.saving i{background:transparent;border:2px solid var(--ink-3);border-top-color:transparent;animation:spin .8s linear infinite;width:10px;height:10px}
.badge.local i{background:#f0a83c}
.badge.off i{background:transparent;border:1.5px dashed var(--ink-3)}
.badge.err{color:var(--danger);border-color:var(--danger)}.badge.err i{background:var(--danger)}
.badge.pulse i{animation:pulse .6s var(--in)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.7)}}
.wrap{padding:12px 32px 48px;max-width:1200px;width:100%}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:start;box-shadow:var(--sh-1);transition:transform var(--t-base) var(--in)}
.kpi:hover{transform:translateY(-2px)}
.kpi span{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.kpi span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.kpi b{display:block;font-size:30px;font-weight:600;line-height:1.2;margin-top:4px}
.kpi small{font-size:12px;color:var(--ink-3)}
.kpi.alert b{color:var(--danger)}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 2px 10px}
.sec-h h2{font-size:17px;font-weight:600}.sec-h .sp{flex:1}.sec-h small{color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1);overflow:hidden}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background var(--t-fast),color var(--t-fast)}
.chip b{font-weight:600;font-size:12px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--plum-soft);border-color:transparent;color:var(--plum)}.chip[aria-pressed="true"] b{color:var(--plum)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.tools .sp{flex:1}
/* rows */
.row{display:grid;grid-template-columns:100px minmax(140px,1.2fr) minmax(160px,1.6fr) 80px 120px 120px 104px;gap:12px;align-items:center;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--line);width:100%;text-align:start;transition:background var(--t-fast);position:relative;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover,.row.kf{background:var(--surface-2)}
.row.over{box-shadow:inset -2px 0 0 var(--danger)}
.row .cl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pr{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .q{text-align:end;color:var(--ink-2)}
.thead{display:grid;grid-template-columns:100px minmax(140px,1.2fr) minmax(160px,1.6fr) 80px 120px 120px 104px;gap:12px;padding:10px 16px;font-size:12px;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--line);background:var(--surface-2)}
.thead span:nth-child(4){text-align:end}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--t);background:var(--b);justify-self:start;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
button.pill{cursor:pointer}button.pill:hover{filter:brightness(.97)}
.s-open{--t:var(--st-open-t);--b:var(--st-open-b)}.s-ready{--t:var(--st-ready-t);--b:var(--st-ready-b)}.s-delivered{--t:var(--st-del-t);--b:var(--st-del-b)}.s-invoiced{--t:var(--st-inv-t);--b:var(--st-inv-b)}.s-cancelled{--t:var(--st-can-t);--b:var(--st-can-b)}
.rb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.rb .seg{display:flex;gap:2px;flex:1;max-width:84px}
.rb .seg i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.rb .seg i.on{background:var(--plum)}
.rb.full .seg i{background:var(--berg)}
.dl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dl .ic{width:15px;height:15px}
.dl.soon{color:var(--amber)}.dl.late{color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:2px 7px}
.age{font-size:12px;color:var(--ink-3)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty .ei{width:56px;height:56px;border-radius:16px;background:var(--plum-soft);color:var(--plum);display:grid;place-items:center;margin:0 auto 12px}
.empty .ei .ic{width:28px;height:28px}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:4px}.empty p{margin-bottom:14px}
.enter>*{animation:rise var(--t-base) var(--in) both;animation-delay:calc(var(--i,0) * 16ms)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
/* prep (shortages) */
.grp{border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp>summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;list-style:none;font-weight:600}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .ct{color:var(--ink-3);font-weight:400;font-size:13px}
.grp>summary .sp{flex:1}
.grp>summary .chev{transition:transform var(--t-base);color:var(--ink-3)}
.grp[open]>summary .chev{transform:rotate(-90deg)}
.pl{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 16px;padding-inline-start:44px;border-top:1px solid var(--line);font-size:14px}
.pl .grow{flex:1;min-width:0}.pl .grow small{display:block;color:var(--ink-3);font-size:12px}
.tick{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;transition:transform var(--t-fast),background var(--t-fast),border-color var(--t-fast);flex:none}
.tick .ic{width:18px;height:18px}
.tick:active{transform:scale(.92)}
.tick.on{background:var(--plum-soft);border-color:var(--plum);color:var(--plum)}
/* clients */
.cr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.cr:last-child{border-bottom:0}.cr:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:50%;background:var(--plum-soft);color:var(--plum);display:grid;place-items:center;font-weight:600;flex:none}
.cr .grow{flex:1;min-width:0}.cr .grow small{display:block;color:var(--ink-3);font-size:12.5px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(18 16 20/.35);z-index:20;opacity:0;pointer-events:none;transition:opacity var(--t-sheet) var(--in)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;bottom:0;inset-inline-end:0;width:520px;max-width:100%;background:var(--surface);z-index:21;box-shadow:var(--sh-2);transform:translateX(-105%);transition:transform var(--t-sheet) var(--in);display:flex;flex-direction:column}
[dir="rtl"] .sheet{transform:translateX(-105%)}
.sheet.on{transform:none}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sh-h h3{font-size:20px;font-weight:600;flex:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh-b{flex:1;overflow:auto;padding:16px 20px 24px}
.sh-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.sh-f .sp{flex:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.fsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.fsec h4{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fsec h4 .sp{flex:1}
.comp{display:grid;grid-template-columns:34px 104px 1fr 68px 84px 30px;gap:8px;align-items:center;margin-bottom:8px}
.comp .in{min-height:38px;padding:6px 10px;font-size:14px}
.comp .x{width:30px;height:30px;border-radius:8px;color:var(--ink-3);display:grid;place-items:center}.comp .x:hover{background:var(--danger-soft);color:var(--danger)}
.comp .note{grid-column:2/-1;margin-top:-4px}
.pct{font-size:12.5px;margin-top:6px;color:var(--ink-2)}.pct.bad{color:var(--danger)}
.stbar{display:flex;gap:6px;flex-wrap:wrap}
.stbar .pill{height:32px;padding:0 12px;font-size:13px;border:1px solid transparent;cursor:pointer;opacity:.55}
.stbar .pill[aria-pressed="true"]{opacity:1;border-color:currentColor}
.stbar .pill:disabled{cursor:not-allowed;opacity:.3}
.log{font-size:13px;color:var(--ink-2)}
.log li{list-style:none;display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.log li span:first-child{color:var(--ink-3);min-width:96px;font-variant-numeric:tabular-nums}
.inline-inv{display:flex;gap:6px;align-items:center}
.inline-inv input{width:130px;min-height:34px;padding:4px 10px;font-size:13px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity var(--t-base),transform var(--t-base) var(--in);z-index:40;box-shadow:var(--sh-2);font-size:14px;max-width:calc(100vw - 24px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--berg);font-weight:600;padding:4px 8px}
/* settings */
.set{padding:16px}
.set+.set{border-top:1px solid var(--line)}
.set h3{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.set p{font-size:13.5px;color:var(--ink-2);margin-bottom:10px}
.set .acts{display:flex;gap:8px;flex-wrap:wrap}
.rep{margin-top:10px;font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.rep table{width:100%;border-collapse:collapse}.rep td{padding:3px 4px}.rep td:last-child{text-align:end;font-weight:600}
.ok{color:var(--berg-ink)}.bad{color:var(--danger)}
/* mobile */
.tabbar,.fab,.mtitle{display:none}
@media (max-width:1023px){
 .app{grid-template-columns:1fr}
 .side{display:none}
 .top{padding:calc(8px + env(safe-area-inset-top)) 16px 8px;flex-wrap:wrap;gap:8px}
 .top h1{font-size:30px;flex:1;min-width:0}
 .sf{order:3;flex-basis:100%;max-width:none}.sf kbd{display:none}
 .top .newb{display:none}
 .wrap{padding:8px 16px calc(96px + env(safe-area-inset-bottom))}
 .kpis{grid-template-columns:1fr 1fr}
 .grid2{grid-template-columns:1fr}
 .thead{display:none}
 .row{grid-template-columns:1fr auto;grid-template-areas:"c s" "cl cl" "p p" "r d";gap:4px 10px;padding:12px 16px;min-height:0}
 .row .code{grid-area:c}.row .pill{grid-area:s;justify-self:end}.row .cl{grid-area:cl;font-size:16px}.row .pr{grid-area:p;white-space:normal}.row .q{display:none}.row .rb{grid-area:r}.row .dw{grid-area:d;justify-self:end}
 .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:15;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
 .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10.5px;color:var(--ink-3);position:relative}
 .tabbar button .ic{width:24px;height:24px}
 .tabbar button[aria-current="page"]{color:var(--plum)}
 .tabbar .n{position:absolute;top:3px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--plum);color:var(--on-plum);font-size:10.5px;display:grid;place-items:center;padding:0 4px}
 .fab{display:grid;place-items:center;position:fixed;inset-inline-start:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--plum);color:var(--on-plum);box-shadow:var(--sh-2);z-index:16}
 .fab .ic{width:26px;height:26px}
 .sheet{top:auto;left:0;right:0;width:100%;height:92vh;border-radius:20px 20px 0 0;transform:translateY(105%)}
 [dir="rtl"] .sheet{transform:translateY(105%)}
 .sheet::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
 .sheet.on{transform:none}

<script>
(() => {
'use strict';
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (k, c) => `<svg class="ic${c ? ' ' + c : ''}" aria-hidden="true"><use href="#i-${k}"/></svg>`;
const norm = t => String(t ?? '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
  .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/\s+/g, ' ').trim();
const nowISO = () => new Date().toISOString();
const ymd = d => { d = new Date(d); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const today = () => ymd(new Date());
const dmy = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? '' : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
const tm = s => { const d = new Date(s); return isNaN(d) ? '' : dmy(s) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fmt = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits:2 });
const days = (a, b) => Math.round((new Date(ymd(b)) - new Date(ymd(a))) / 864e5);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const STATUS = { open:'بيتجهّز', ready:'جاهز', delivered:'اتسلّم', invoiced:'اتفوتر', cancelled:'ملغي' };
const CK = { bottle:['غرشة','bottle'], cap:['غطا','bottle'], pump:['بمب','bottle'], spray:['بخاخ','bottle'], box:['علبة','box'], sticker:['ستيكر','box'], plate:['بليت','box'], bottomsticker:['ستيكر قاعدة','box'], dye:['صبغة','dye'], alcohol:['كحول','oil'], oil:['زيت','oil'], bacteria:['مادة حافظة','oil'] };
const UNITS = ['قطعة','%','مل','جرام','كجم'];
const isOpen = o => o.status === 'open' || o.status === 'ready';

/* ================= storage: IndexedDB master + Drive folder mirror ================= */
const DBP = new Promise((ok, no) => { const r = indexedDB.open('noor-orders2', 1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); }; r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const kv = { get: async k => { const d = await DBP; return new Promise(ok => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); }); },
             set: async (k, v) => { const d = await DBP; return new Promise((ok, no) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = () => no(t.error); }); } };
let S = { schema:1, seq:0, deviceId:'', savedAt:'', clients:{}, orders:{}, comps:{} };
let DIR = null, DRV = 'off', driveTimer = null, dirty = false, lastDrive = 0;
const canFS = 'showDirectoryPicker' in window;
const BC = 'BroadcastChannel' in window ? new BroadcastChannel('noor-orders2') : null;
function mergeInto(dst, src){ const nw = (a, b) => (a?.updatedAt || '') > (b?.updatedAt || ''); for (const k of ['orders','clients']) for (const [id, v] of Object.entries(src?.[k] || {})) if (!dst[k][id] || nw(v, dst[k][id])) dst[k][id] = v; dst.seq = Math.max(dst.seq || 0, src?.seq || 0); }
async function persist(){
  S.savedAt = nowISO(); dirty = true; setBadge('saving');
  try { const cur = await kv.get('state'); if (cur && cur.savedAt !== S.savedAt) mergeInto(S, cur); await kv.set('state', S); BC && BC.postMessage('saved'); } catch (e) { setBadge('err', 'مش متحفظ على الجهاز!'); toast('الحفظ على الجهاز فشل: ' + e.message); return; }
  if (CLOUD) { cloudDirty = true; kv.set('cloudDirty', true); clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudSync, 800); return; }
  if (DIR) { clearTimeout(driveTimer); driveTimer = setTimeout(writeDrive, 1000); } else { dirty = false; setBadge(canFS ? 'off' : 'local'); }
}
async function permOK(h, ask){ try { const o = { mode:'readwrite' }; if ((await h.queryPermission(o)) === 'granted') return true; return ask ? (await h.requestPermission(o)) === 'granted' : false; } catch (e) { return false; } }
async function writeFile(dir, name, text){ const fh = await dir.getFileHandle(name, { create:true }); const w = await fh.createWritable(); await w.write(text); await w.close(); }
let WRITING = false;
async function writeDrive(){
  clearTimeout(driveTimer); if (!DIR) return; if (WRITING) { driveTimer = setTimeout(writeDrive, 400); return; } WRITING = true; try { await writeDrive2(); } finally { WRITING = false; } }
async function writeDrive2(){
  if (!(await permOK(DIR, false))) { setBadge('err', 'محتاج إذن للفولدر'); return; }
  try {
    const txt = JSON.stringify(S);
    await writeFile(DIR, 'orders.json', txt);
    const snaps = await DIR.getDirectoryHandle('snapshots', { create:true }), nm = `orders-${today()}.json`;
    let has = false; try { await snaps.getFileHandle(nm); has = true; } catch (e) {}
    if (!has) { await writeFile(snaps, nm, txt); const all = []; for await (const [n] of snaps.entries()) if (/^orders-\d{4}-\d{2}-\d{2}\.json$/.test(n)) all.push(n); all.sort(); for (const n of all.slice(0, Math.max(0, all.length - 30))) await snaps.removeEntry(n); }
    dirty = false; lastDrive = Date.now(); await kv.set('lastDrive', lastDrive); setBadge('ok');
  } catch (e) { setBadge('err', 'مش متحفظ على Drive'); console.error(e); }
}
function setBadge(st, msg){
  DRV = st; const b = $('badge'), t = b.lastElementChild;
  b.className = 'badge ' + ({ ok:'', saving:'saving', local:'local', off:'off', err:'err' }[st] || '');
  t.textContent = msg || ({ ok:'محفوظ', saving:'بيحفظ…', local: lastDrive ? 'آخر نسخة: ' + tm(lastDrive) : 'محفوظ على الجهاز بس', off: canFS ? 'Drive مش متوصل' : 'محفوظ على الجهاز بس', err:'مش محفوظ على Drive' }[st]);
  if (st === 'ok'){ b.classList.add('pulse'); setTimeout(() => b.classList.remove('pulse'), 650); }
}
/* ================= cloud: Google Drive via Apps Script = master copy ================= */
let CLOUD = null, cloudTimer = null, cloudBusy = false, cloudAgain = false, cloudDirty = false, lastCloud = 0, cloudRetry = null;
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
async function cloudCall(body, url, key){ const r = await fetch(url || CLOUD.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ key:key || CLOUD.key, ...body }), redirect:'follow', cache:'no-store' });
  const j = await r.json(); if (!j.ok) throw new Error(j.err === 'key' ? 'المفتاح غلط' : (j.err || 'السيرفر رفض')); return j; }
function cloudOK(){ lastCloud = Date.now(); kv.set('lastCloud', lastCloud); setBadge('ok', 'محفوظ على Drive ' + hhmm(lastCloud)); }
function cloudFail(e){ setBadge('local', navigator.onLine === false ? '⏳ مستني النت — محفوظ على الموبايل' : '⏳ مش متبعت لسه — هحاول تاني'); clearTimeout(cloudRetry); cloudRetry = setTimeout(() => cloudDirty ? cloudSync() : cloudPull(), 20000); console.warn('cloud', e && e.message); }
async function takeServer(j){ for (const r of j.renamed || []) { const o = S.orders[r.from]; if (o && o.createdAt === r.createdAt) delete S.orders[r.from]; }
  const before = JSON.stringify([S.seq, Object.keys(S.orders).length, Object.values(S.orders).map(o => o.updatedAt).sort().pop()]);
  mergeInto(S, j.state || {}); const used = new Set(Object.values(S.orders).map(o => o.clientId)); for (const id of Object.keys(S.clients)) if (!(j.state?.clients || {})[id] && !used.has(id)) delete S.clients[id]; await kv.set('state', S); BC && BC.postMessage('saved');
  if (JSON.stringify([S.seq, Object.keys(S.orders).length, Object.values(S.orders).map(o => o.updatedAt).sort().pop()]) !== before && !$('sheet').classList.contains('on')) render();
  if ((j.renamed || []).length) toast(j.renamed.map(r => `${r.from} بقى ${r.to} (اتعمل على جهازين)`).join(' · ')); }
async function cloudSync(loud){

    if (d.v2) return go(d.v2);

}

const phead = t => `<div class="rh"><span class="mk">ن</span><div><h1>${esc(t)}</h1><div class="sub">نور الخليج للعطور</div></div><span class="sp"></span><div class="dt">${tm(nowISO())}</div></div>`;
function printOrder(o){ const l = o.lines[0] || {}; doPrint(phead('أوردر ' + o.oc) + `<table><tr><th>العميل</th><td>${esc(cname(o.clientId))}</td><th>الحالة</th><td>${STATUS[o.status]}</td></tr><tr><th>المنتج</th><td>${esc(l.product)} ${esc(l.size || '')}</td><th>الكمية</th><td>${fmt(l.qty)}</td></tr><tr><th>تاريخ الأوردر</th><td>${dmy(o.createdAt)}</td><th>ميعاد التسليم</th><td>${dmy(o.dueDate) || '—'}</td></tr></table>
  <table><tr><th>#</th><th>المكوّن</th><th>الصنف</th><th>للقطعة</th><th>المطلوب</th><th>جاهز</th><th>ملاحظة</th></tr>${(o.comps || []).map((c, i) => `<tr><td>${i + 1}</td><td>${esc(CK[c.k]?.[0] || c.k)}</td><td>${esc(c.name)}</td><td>${fmt(c.qty)} ${esc(c.unit)}</td><td>${c.unit === 'قطعة' ? fmt(c.qty * l.qty) : ''}</td><td>${c.ready ? '✓' : '☐'}</td><td>${esc(c.note)}</td></tr>`).join('')}</table>${o.notes ? `<p><b>ملاحظات:</b> ${esc(o.notes)}</p>` : ''}<p style="margin-top:30pt">التوقيع: ____________________</p>`); }
/* full report: every active order per client, each component with its state (واصل / ناقص) */
function printFull(onlyId, missOnly){
  const L = ord().filter(o => isOpen(o) && (!onlyId || o.clientId === onlyId)), G = new Map();
  for (const o of L) { if (!G.has(o.clientId)) G.set(o.clientId, []); G.get(o.clientId).push(o); }
  const groups = [...G].sort((a, b) => cname(a[0]).localeCompare(cname(b[0]), 'ar'));
  const all = L.flatMap(o => o.comps || []), rd = all.filter(c => c.ready).length;
  const bar = (r, n) => `<span class="bar"><span class="t"><i style="width:${n ? Math.round(r / n * 100) : 0}%"></i></span>${r}/${n} واصل</span>`;
  const sum = `<div class="sum">${onlyId ? '' : `<div><small>العملاء</small><b>${groups.length}</b></div>`}<div><small>أوردرات شغالة</small><b>${L.length}</b></div><div><small>المكوّنات</small><b>${all.length}</b></div><div class="g"><small>✓ واصل</small><b>${rd}</b></div><div class="r"><small>✗ ناقص</small><b>${all.length - rd}</b></div></div>
   <div class="leg"><i style="background:#c2362b"></i>ناقص (بخط عريض وأحمر)<i style="background:#9cc21f"></i>واصل (رمادي)</div>`;
  const qtyTxt = c => c.qty === '' || c.qty == null ? '—' : fmt(c.qty) + ' ' + esc(c.unit);
  const body = groups.map(([cid, os]) => { const cc = os.flatMap(o => o.comps || []), cr = cc.filter(c => c.ready).length;
    return `<div class="cl"><h2>${esc(cname(cid))}</h2><span>${os.length} أوردر</span><span class="sp"></span>${bar(cr, cc.length)}</div>` + os.sort((a, b) => a.createdAt.localeCompare(b.createdAt)).map(o => { const l = o.lines[0] || {}, [r, n] = readyCount(o), d = dueInfo(o);
      const comps = (o.comps || []).map((c, i) => ({ c, i })).filter(x => !missOnly || !x.c.ready).sort((a, b) => a.c.ready - b.c.ready || a.i - b.i);
      return `<div class="oc"><div class="oh"><span class="code">${esc(o.oc)}</span><span class="pr">${esc(l.product)}${l.size ? ' · ' + esc(l.size) : ''}</span><span class="meta">× ${fmt(l.qty)} · من ${dmy(o.createdAt)}${o.dueDate ? ` · التسليم ${dmy(o.dueDate)}${d && d.d < 0 ? ' <b style="color:#c2362b">(' + d.txt + ')</b>' : ''}` : ''}</span><span class="sp"></span>${bar(r, n)}<span class="st ${o.status}">${STATUS[o.status]}</span></div>
      ${n ? `<table><colgroup><col style="width:13%"><col style="width:25%"><col style="width:13%"><col style="width:12%"><col style="width:11%"><col style="width:11%"><col></colgroup><tr><th>المكوّن</th><th>الصنف</th><th>للقطعة</th><th>المطلوب</th><th>الحالة</th><th>وصل في</th><th>ملاحظة</th></tr>${comps.map(({ c }) => `<tr class="${c.ready ? 'ok' : 'miss'}"><td class="item">${esc(CK[c.k]?.[0] || c.k)}</td><td class="item">${esc(c.name) || '—'}</td><td class="n">${qtyTxt(c)}</td><td class="n">${c.unit === 'قطعة' && c.qty !== '' ? fmt(c.qty * l.qty) : ''}</td><td>${c.ready ? '<span class="tag ok">✓ واصل</span>' : '<span class="tag miss">✗ ناقص</span>'}</td><td class="n">${c.ready ? dmy(c.readyAt) : ''}</td><td>${esc(c.note)}</td></tr>`).join('')}</table>` : '<div class="note">من غير مكوّنات</div>'}${o.notes ? `<div class="note">ملاحظات: ${esc(o.notes)}</div>` : ''}</div>`; }).join(''); }).join('');
  doPrint(phead((missOnly ? 'نواقص ' : 'تفاصيل أوردرات ') + (onlyId ? cname(onlyId) : 'كل العملاء')) + sum + (body || '<p>مفيش أوردرات شغالة</p>'));
}
function printClient(id){ const L = ord().filter(o => o.clientId === id && isOpen(o));
  doPrint(phead('نواقص ' + cname(id)) + (L.map(o => { const m = (o.comps || []).filter(c => !c.ready); return `<h3 style="margin-top:12pt">${esc(o.oc)} — ${esc(o.lines[0]?.product)} × ${fmt(o.lines[0]?.qty)}</h3>${m.length ? `<table><tr><th>المكوّن</th><th>الصنف</th><th>المطلوب</th><th>ملاحظة</th></tr>${m.map(c => `<tr><td>${esc(CK[c.k]?.[0] || c.k)}</td><td>${esc(c.name)}</td><td>${fmt(c.qty)} ${esc(c.unit)}${c.unit === 'قطعة' ? ' × ' + fmt(o.lines[0]?.qty) + ' = ' + fmt(c.qty * o.lines[0]?.qty) : ''}</td><td>${esc(c.note)}</td></tr>`).join('')}</table>` : '<p>كل المكوّنات جاهزة ✓</p>'}`; }).join('') || '<p>مفيش أوردرات شغالة</p>')); }
function printPrep(){ const it = prepItems(), G = new Map(); for (const x of it) { const k = CK[x.c.k]?.[0] || x.c.k; if (!G.has(k)) G.set(k, []); G.get(k).push(x); }
  doPrint(phead('النواقص — حسب المكوّن') + [...G].map(([k, L]) => `<h3 style="margin-top:12pt">${esc(k)} (${L.length})</h3><table><tr><th>الأوردر</th><th>العميل</th><th>المنتج</th><th>الصنف</th><th>المطلوب</th></tr>${L.map(x => `<tr><td>${esc(x.o.oc)}</td><td>${esc(cname(x.o.clientId))}</td><td>${esc(x.o.lines[0]?.product)}</td><td>${esc(x.c.name)}</td><td>${fmt(x.c.qty)} ${esc(x.c.unit)}${x.c.unit === 'قطعة' ? ' = ' + fmt(x.c.qty * x.o.lines[0]?.qty) : ''}</td></tr>`).join('')}</table>`).join('')); }
function printList(){ const L = filtered(); doPrint(phead(`قايمة الأوردرات (${L.length})`) + `<table><tr><th>الكود</th><th>العميل</th><th>المنتج</th><th>الكمية</th><th>المكوّنات</th><th>الحالة</th><th>الميعاد</th></tr>${L.map(o => { const [r, n] = readyCount(o); return `<tr><td>${esc(o.oc)}</td><td>${esc(cname(o.clientId))}</td><td>${esc(o.lines[0]?.product)}</td><td>${fmt(o.lines[0]?.qty)}</td><td>${r}/${n}</td><td>${STATUS[o.status]}</td><td>${dmy(o.dueDate)}</td></tr>`; }).join('')}</table>`); }

/* ================= theme + boot ================= */
function setTheme(t){ try { localStorage.setItem('no2_theme', t); } catch (e) {} if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
(async () => {
  try { setTheme(localStorage.getItem('no2_theme') || 'auto'); CUR = localStorage.getItem('no2_view') || 'home'; } catch (e) {}
  try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch (e) {}
  const st = await kv.get('state'); if (st && st.orders) S = st;
  if (!S.deviceId) S.deviceId = (/iP(hone|ad)/.test(navigator.userAgent) ? 'iphone-' : 'pc-') + Math.random().toString(36).slice(2, 6);
  lastDrive = (await kv.get('lastDrive')) || (await kv.get('lastExport')) || 0;
  CLOUD = (await kv.get('cloud')) || null; cloudDirty = !!(await kv.get('cloudDirty')); lastCloud = (await kv.get('lastCloud')) || 0;
  const h = canFS && !CLOUD ? await kv.get('dir') : null;
  if (h) { DIR = h; setBadge((await permOK(h, false)) ? 'ok' : 'err', (await permOK(h, false)) ? 'محفوظ' : 'محتاج إذن للفولدر'); } else setBadge(canFS ? 'off' : 'local');
  $('sheet').inert = true;
  if (CLOUD) { setBadge(lastCloud ? 'ok' : 'local', lastCloud ? 'محفوظ على Drive ' + hhmm(lastCloud) : ''); cloudDirty ? cloudSync() : cloudPull(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (BC) BC.onmessage = async () => { const st2 = await kv.get('state'); if (st2) { mergeInto(S, st2); render(); } };
  render();
})();
})();
</script>
